[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfire-ml"
version = "0.1.0"
description = "Reproducible TensorFlow DenseNet wildfire image classification pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "tensorflow>=2.16,<2.19",
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
  "matplotlib>=3.8,<4",
  "Pillow>=10,<12",
  "PyYAML>=6,<7",
  "mlflow>=2.12,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "dvc>=3.50,<4",
  "jupyterlab>=4,<5",
  "ipykernel>=6,<7",
]
serve = [
  "fastapi>=0.111,<1",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
wildfire-ml = "wildfire_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=wildfire_ml --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]


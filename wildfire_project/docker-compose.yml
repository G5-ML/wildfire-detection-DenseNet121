services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./monitoring:/app/monitoring
    environment:
      WILDFIRE_CONFIG: /app/params.yaml
      WILDFIRE_MODEL: /app/artifacts/models/final.keras
      WILDFIRE_PREDICTION_LOG: /app/monitoring/predictions.jsonl
    restart: unless-stopped

  mlflow:
    build: .
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --default-artifact-root=/mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow-docker:/mlflow
    restart: unless-stopped
